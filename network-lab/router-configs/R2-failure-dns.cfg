! =========================================================
! CISCO ROUTER R2 - FAILURE SCENARIO 5: DNS PORT 53 BLOCKED
! Fault Injected: Extended Access-List dropping UDP/TCP 53
! Result: Pinging IP 192.168.10.100 succeeds (ICMP permitted),
! but hostname lookup for "srv.lab.local" fails / times out.
! =========================================================
version 15.1
hostname Router-R2-Scenario5
!
ip access-list extended BLOCK_DNS_TRAFFIC
 deny udp any host 192.168.10.100 eq domain
 deny tcp any host 192.168.10.100 eq domain
 permit ip any any
!
interface GigabitEthernet0/0/0
 description Server Farm Gateway
 ip address 192.168.10.97 255.255.255.240
 ip access-group BLOCK_DNS_TRAFFIC out
 no shutdown
!
interface Serial0/1/0
 ip address 192.168.10.114 255.255.255.252
 no shutdown
!
router rip
 version 2
 no auto-summary
 network 192.168.10.0
!
end
