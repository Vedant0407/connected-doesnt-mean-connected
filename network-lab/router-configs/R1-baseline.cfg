! =========================================================
! CISCO ROUTER R1 - BASELINE CONFIGURATION
! Model: Cisco 2911 Integrated Services Router
! Purpose: Default Gateway for LAN A + WAN DCE Gateway
! =========================================================
version 15.1
service timestamps log datetime msec
no service password-encryption
!
hostname Router-R1
!
ip dhcp excluded-address 192.168.10.1 192.168.10.4
!
ip dhcp pool CLIENT_LAN
 network 192.168.10.0 255.255.255.192
 default-router 192.168.10.1
 dns-server 192.168.10.100
 domain-name lab.local
 lease 1 0 0
!
interface GigabitEthernet0/0/0
 description LAN A Gateway (Student Clients)
 ip address 192.168.10.1 255.255.255.192
 duplex auto
 speed auto
 no shutdown
!
interface Serial0/1/0
 description Point-to-Point WAN Link to Router R2 (DCE)
 ip address 192.168.10.113 255.255.255.252
 clock rate 64000
 no shutdown
!
router rip
 version 2
 no auto-summary
 network 192.168.10.0
 passive-interface GigabitEthernet0/0/0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
end
