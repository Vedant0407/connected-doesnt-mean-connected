! =========================================================
! CISCO ROUTER R1 - FAILURE SCENARIO 2: DHCP SERVICE DISABLED
! Fault Injected: "no service dhcp" and excluded address range
! Result: Clients link to Layer 2 switch but receive no DHCP Offer.
! Clients self-assign APIPA 169.254.x.x addresses with no gateway.
! =========================================================
version 15.1
hostname Router-R1-Scenario2
!
no service dhcp
!
interface GigabitEthernet0/0/0
 description LAN A Gateway
 ip address 192.168.10.1 255.255.255.192
 no shutdown
!
interface Serial0/1/0
 ip address 192.168.10.113 255.255.255.252
 clock rate 64000
 no shutdown
!
router rip
 version 2
 no auto-summary
 network 192.168.10.0
!
end
