! =========================================================
! CISCO ROUTER R2 - BASELINE CONFIGURATION
! Model: Cisco 2911 Integrated Services Router
! Purpose: Server Farm Gateway + WAN DTE Gateway
! =========================================================
version 15.1
service timestamps log datetime msec
no service password-encryption
!
hostname Router-R2
!
interface GigabitEthernet0/0/0
 description Server Farm Gateway (DNS & Web Servers)
 ip address 192.168.10.97 255.255.255.240
 duplex auto
 speed auto
 no shutdown
!
interface Serial0/1/0
 description Point-to-Point WAN Link to Router R1 (DTE)
 ip address 192.168.10.114 255.255.255.252
 no shutdown
!
router rip
 version 2
 no auto-summary
 network 192.168.10.0
 passive-interface GigabitEthernet0/0/0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
line aux 0
line vty 0 4
 login
!
end
