! =========================================================
! CISCO ROUTER R1 - FAILURE SCENARIO 3: GATEWAY INTERFACE DOWN
! Fault Injected: GigabitEthernet0/0/0 set to "shutdown"
! Result: Default gateway does not reply to ARP or ICMP Echo.
! Client ping times out with "Destination host unreachable".
! =========================================================
version 15.1
hostname Router-R1-Scenario3
!
interface GigabitEthernet0/0/0
 description LAN A Gateway (DOWN FOR TESTING)
 ip address 192.168.10.1 255.255.255.192
 shutdown
!
interface Serial0/1/0
 ip address 192.168.10.113 255.255.255.252
 clock rate 64000
 no shutdown
!
router rip
 version 2
 no auto-summary
 network 192.168.10.0
!
end
