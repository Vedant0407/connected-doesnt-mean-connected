! =========================================================
! CISCO ROUTER R2 - FAILURE SCENARIO 6: HTTP PORT 80 BLOCKED
! Fault Injected: Extended Access-List dropping TCP port 80
! Result: ICMP Echo Reply succeeds with 0% loss;
! but TCP port 80 handshake fails or times out.
! =========================================================
version 15.1
hostname Router-R2-Scenario6
!
ip access-list extended BLOCK_HTTP_SERVICE
 deny tcp any host 192.168.10.105 eq www
 permit ip any any
!
interface GigabitEthernet0/0/0
 description Server Farm Gateway
 ip address 192.168.10.97 255.255.255.240
 ip access-group BLOCK_HTTP_SERVICE out
 no shutdown
!
interface Serial0/1/0
 ip address 192.168.10.114 255.255.255.252
 no shutdown
!
router rip
 version 2
 no auto-summary
 network 192.168.10.0
!
end
